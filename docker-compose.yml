version: "3.8"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - aayu_network
    env_file:
      - .env

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - aayu_network
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - ./credentials:/app/credentials:ro
    env_file:
      - ./backend/.env
    environment:
      # Explicitly set the credentials path to match the volume mount
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/serviceAccountKey.json
      # Needed to prevent ChromaDB threading issues in Docker
      - CHROMA_CACHE_DIR=/app/chroma_db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  aayu_network:
    driver: bridge

volumes:
  chroma_data:
  uploads_data:
